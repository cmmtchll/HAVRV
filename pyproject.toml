[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "havrv"
version = "0.1.0"
description = "Home Assistant virtual integration for recreational vehicles"
requires-python = ">=3.14.2,<3.15"
dependencies = []

[project.optional-dependencies]
test = [
    "homeassistant>=2026.10.0b0,<2026.11",
    "pytest-homeassistant-custom-component>=0.13.368,<0.14",
    "pytest-cov>=6.0.0",
    "ruff>=0.14.0",
    "mypy>=2.3,<3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = [
    "--strict-markers",
    "--strict-config",
    "--cov=custom_components.havrv",
    "--cov-report=term-missing",
    "--cov-fail-under=96",
]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "D"]
ignore = ["D203", "D213"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.14"
strict = true
files = ["custom_components/havrv"]
