rules:
  action-setup:
    status: exempt
    comment: No integration service actions are registered; mapped entity controls use their native platform actions.
  appropriate-polling:
    status: exempt
    comment: HAVRV is local-push and subscribes to source entity state changes; it does not poll.
  brands:
    status: done
    comment: HACS-compatible icon asset is present at custom_components/havrv/brand/icon.png.
  common-modules:
    status: done
    comment: Shared source-entity behavior is centralized in custom_components/havrv/entity.py; independent power-source identities and defaults are shared through custom_components/havrv/power.py.
  config-flow-test-coverage:
    status: done
    comment: CI enforces 100% config-flow module coverage with tests/test_config_flow.py.
  config-flow:
    status: done
    comment: UI setup flow, field descriptions, config data and options are implemented in custom_components/havrv/config_flow.py and custom_components/havrv/strings.json.
  dependency-transparency:
    status: done
    comment: No runtime requirements are declared in custom_components/havrv/manifest.json.
  docs-actions:
    status: exempt
    comment: No integration service actions are provided; controls are exposed as standard mapped entities.
  docs-triggers:
    status: exempt
    comment: HAVRV does not provide integration-specific triggers.
  docs-conditions:
    status: exempt
    comment: HAVRV does not provide integration-specific conditions.
  docs-high-level-description:
    status: done
    comment: The integration purpose and supported use are described in README.md.
  docs-installation-instructions:
    status: done
    comment: HACS and manual setup steps are documented in README.md.
  docs-removal-instructions:
    status: done
    comment: Config-entry removal behavior is documented in README.md.
  entity-event-setup:
    status: done
    comment: Source state listeners are registered and removed with entity lifecycle in custom_components/havrv/entity.py.
  entity-unique-id:
    status: done
    comment: Mapped, profile, configuration-number, and operation-mode entities define stable unique IDs in custom_components/havrv/entity.py, custom_components/havrv/sensor.py, custom_components/havrv/number.py, and custom_components/havrv/select.py.
  has-entity-name:
    status: done
    comment: Mapped, profile, configuration-number, and operation-mode entities set has_entity_name in custom_components/havrv/entity.py, custom_components/havrv/sensor.py, custom_components/havrv/number.py, and custom_components/havrv/select.py.
  runtime-data:
    status: done
    comment: Typed config-entry runtime data is populated in custom_components/havrv/__init__.py.
  test-before-configure:
    status: exempt
    comment: Setup only maps existing local Home Assistant entities and has no remote connection or credentials to test.
  test-before-setup:
    status: exempt
    comment: Setup has no external service or device connection; unavailable source entities are intentionally supported.
  unique-config-entry:
    status: done
    comment: Case-insensitive profile uniqueness is implemented and tested in custom_components/havrv/config_flow.py and tests/test_config_flow.py.
  action-exceptions:
    status: exempt
    comment: No integration service actions are registered that can raise service-action failures.
  config-entry-unloading:
    status: done
    comment: Platforms unload through the config-entry lifecycle and are tested in tests/test_init.py.
  docs-configuration-parameters:
    status: done
    comment: Profile fields, measurement units, and entity mapping options are described in README.md.
  docs-installation-parameters:
    status: done
    comment: README.md documents installation methods and prerequisites; no integration-specific install parameters are required.
  entity-unavailable:
    status: done
    comment: Mapped entities become unavailable when sources are absent or unavailable, tested in tests/test_entities.py; power readings also reject nonfinite/incompatible units and undefined Enabled, Charging, Warning and Problem states, with recovery/remapping/removal tested in tests/test_power.py.
  integration-owner:
    status: done
    comment: An active code owner is declared in custom_components/havrv/manifest.json.
  log-when-unavailable:
    status: exempt
    comment: HAVRV has no external connection; unavailable local source entities do not require connection-recovery logging.
  parallel-updates:
    status: done
    comment: All seven platform modules explicitly set PARALLEL_UPDATES = 0 and tests/test_entities.py verifies each declaration; mirrors are event-driven, configuration numbers and the operation-mode select are local, and controls delegate concurrency to the mapped source domain.
  reauthentication-flow:
    status: exempt
    comment: HAVRV has no authentication, credentials, or external service.
  test-coverage:
    status: done
    comment: CI enforces at least 96% coverage for custom_components/havrv in pyproject.toml.
  devices:
    status: done
    comment: RV, mapped-system, and independent power-source devices are created in custom_components/havrv/__init__.py and tested in tests/test_init.py and tests/test_power.py; the Operations device is created in custom_components/havrv/select.py and tested in tests/test_operations.py.
  diagnostics:
    status: done
    comment: Diagnostics export redacted entry and entity data in custom_components/havrv/diagnostics.py, tested in tests/test_diagnostics.py.
  discovery-update-info:
    status: exempt
    comment: HAVRV has no discoverable network device or address information to update.
  discovery:
    status: exempt
    comment: HAVRV is a virtual profile and user-selected entity mapper, not a physical device integration.
  docs-data-update:
    status: done
    comment: README.md documents event-driven source updates and configuration-based profile changes.
  docs-examples:
    status: done
    comment: README.md provides end-user automation examples for mapped binary sensors and switches.
  docs-known-limitations:
    status: done
    comment: README.md identifies planned profile fields and project functionality not yet implemented.
  docs-supported-devices:
    status: exempt
    comment: HAVRV maps arbitrary Home Assistant entities and does not support a fixed manufacturer or device list.
  docs-supported-functions:
    status: done
    comment: README.md lists supported source domains, mirrored attributes, controls, availability, and update behavior.
  docs-troubleshooting:
    status: done
    comment: README.md provides troubleshooting guidance for missing mappings, unavailable sources, controls, tire readings, and profile values.
  docs-use-cases:
    status: done
    comment: README.md describes profile reference, system grouping, and entity-independent automation use cases.
  dynamic-devices:
    status: done
    comment: Options changes add mapped system devices after setup, tested in tests/test_init.py.
  entity-category:
    status: done
    comment: Mapped entities preserve source categories; profile and tire problem sensors are diagnostic, and editable quantities and limits use CONFIG in custom_components/havrv/number.py, verified in tests/test_configuration_numbers.py.
  entity-device-class:
    status: done
    comment: Dimensions, capacities, pressure/temperature limits, and battery limits use applicable number device classes in custom_components/havrv/number.py; profile-unit defaults and explicit per-entity overrides are covered by tests/test_configuration_numbers.py.
  entity-disabled-by-default:
    status: exempt
    comment: Entities are explicitly configured or profile values entered by the user; no optional noisy entity set is generated.
  entity-translations:
    status: done
    comment: Profile and configuration-number entity names and operation-mode states are translated in custom_components/havrv/strings.json, verified by tests/test_configuration_numbers.py and tests/test_operations.py.
  exception-translations:
    status: done
    comment: Configuration-number validation raises translated ServiceValidationError messages defined in custom_components/havrv/strings.json and tested in tests/test_configuration_numbers.py.
  icon-translations:
    status: done
    comment: HAVRV-owned profile and operation-mode icons are translated in custom_components/havrv/icons.json and checked in tests/test_init.py.
  reconfiguration-flow:
    status: done
    comment: The reconfigure flow updates profile details while retaining identity and active mappings in custom_components/havrv/config_flow.py; reducing bank counts removes obsolete bank settings, tested in tests/test_config_flow.py and tests/test_power.py.
  repair-issues:
    status: exempt
    comment: There are no remote device, service, or credential conditions that require user-intervention repair issues.
  stale-devices:
    status: done
    comment: Stale mapped entities and empty system, tire, or power-source child devices are removed during setup in custom_components/havrv/__init__.py, tested in tests/test_init.py and tests/test_power.py.
  async-dependency:
    status: exempt
    comment: HAVRV declares no external runtime dependencies.
  inject-websession:
    status: exempt
    comment: HAVRV has no HTTP client or external service dependency that could use Home Assistant's web session.
  strict-typing:
    status: done
    comment: Strict mypy configuration and CI enforcement cover integration source in pyproject.toml and .github/workflows/validate.yml.
